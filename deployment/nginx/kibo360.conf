# ==============================================================================
# KIBO360 Project Hub — Production Virtual Host Configuration
# Livexpert Technologies Pvt. Ltd.
# Handles HTTPS termination, static SPA delivery, API proxying, and caching.
# ==============================================================================

upstream backend_cluster {
    server backend:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP to HTTPS Redirection Server Block
server {
    listen 80;
    listen [::]:80;
    server_name kibo360.livexpert.in localhost;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Internal health check ping for load balancers
    location /nginx-health {
        access_log off;
        return 200 '{"status":"healthy","server":"nginx"}';
        add_header Content-Type application/json;
    }

    # Redirect all HTTP requests to secure HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Secure HTTPS Virtual Host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kibo360.livexpert.in localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SSL / TLS Certificate Configuration
    ssl_certificate /etc/nginx/ssl/kibo360.crt;
    ssl_certificate_key /etc/nginx/ssl/kibo360.key;

    # TLS Protocols & Cipher Suite
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://kibo360.livexpert.in;" always;

    # Backend REST API Reverse Proxy
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;

        # Upstream proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        # Timeouts for background jobs and large reports
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for real-time responsiveness
        proxy_buffering off;
    }

    # Static Assets with Hash-Based Immutable Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Frontend Single Page Application Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
