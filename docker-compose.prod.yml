version: "3.8"

services:
  # 1. Production PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: kibo360-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kibo360_hub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Production PostgreSQL password must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - kibo360_pgdata:/var/lib/postgresql/data
      - ./deployment/scripts/init-prod-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - kibo360-internal
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kibo360_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Production Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kibo360-prod-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kibo360_hub}?schema=public
    networks:
      - kibo360-internal
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/v1/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 3. Production Nginx Reverse Proxy & Frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: kibo360-prod-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/kibo360.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/ssl:/etc/nginx/ssl:ro
    networks:
      - kibo360-internal

networks:
  kibo360-internal:
    driver: bridge

volumes:
  kibo360_pgdata:
    name: kibo360_prod_pgdata
  backend_logs:
    name: kibo360_prod_logs
